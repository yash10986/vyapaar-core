{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<script>
(function() {
    function refreshAdminList() {
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set('_refresh', Date.now());
        window.location.reload();
    }

    const shouldPoll = window.location.pathname.includes('/admin/inventory/') || window.location.pathname.includes('/admin/product/');
    if (!shouldPoll) return;

    setInterval(refreshAdminList, 4000);
})();
</script>
{% endblock %}
